# nmbd needs a non-loopback IPv4 interface: without one it logs "waiting for
# interface" and loops inside, until one appears. Type=notify made systemd
# wait for its readiness, so the old cure (start timeout 25 s + restart) turned
# a unit without an eth0 address — cable unplugged, or an AOI on eth1 only —
# into an endless restart loop: seen live, 79 restarts in 47 minutes. Type=
# simple: nmbd counts as started at once, waits for its interface itself and
# comes up the moment eth0 has an address; boot and apply never wait on it.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
Restart=on-failure
RestartSec=10
